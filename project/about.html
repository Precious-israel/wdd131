<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Edsarah Logistics Company </title>
    <meta name="description"
        content="Edsarah Logistics - Reliable logistics solutions worldwide including shipping, warehousing, distribution, and freighting.">
    <meta name="author" content="OJO Israel">
    <link rel="stylesheet" href="styles/edsarah.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/Logo03.webp" alt="Edsarah Logistics Logo">
        </div>

        <!-- Hamburger menu button for mobile -->
        <button id="menuToggle" aria-label="Toggle navigation">&#9776;</button>

        <!-- Navigation menu -->
        <nav id="navMenu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="hero">
            <img id="hero-image" src="images/hero2.webp" alt="Logo">
            <h1>EDSARAH LOGISTICS COMPANY</h1>
            <div class="inner_div">
                <article class="hero information">
                    <h2>About Our Company</h2> <!-- Added heading -->
                    <p id="hero-description"></p> <!-- Populated by JS -->
                </article>
            </div>
        </div>

        <section class="history">
            <h2>Background</h2>
            <div class="history-container">
                <p id="company-history"></p> <!-- Populated by JS -->
                <img id="company-image" src="terminal" alt="Rafting History"> <!-- Populated by JS -->
                <h3>Our Values</h3>
                <ul id="values-list"></ul> <!-- Populated by JS -->
            </div>
        </section>

        <section class="adventures">
            <h2>Our Purpose and Services!</h2>
            <div id="gallery" class="adventures-gallery"></div> <!-- Populated by JS -->
        </section>
    </main>
    
    <footer>
        <p>© <span id="currentYear"></span> | Edsarah Logistics | Lagos, Nigeria | All rights reserved.</p>
        <div class="social-media">
            <a href="#">Facebook</a> | <a href="#">Twitter</a> | <a href="#">LinkedIn</a>
        </div>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/edsarah.js" defer></script>
</body>

</html>
